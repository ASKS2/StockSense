<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StockSense — Sign Up</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-shell__side">
      <span>● StockSense</span>
      <h2>Set up your team's inventory workspace in minutes.</h2>
      <p>Built for inventory managers and warehouse staff who need real-time stock visibility.</p>
    </div>
    <div class="auth-shell__form">
      <div class="auth-card">
        <h1>Create your account</h1>
        <p>Start managing stock the modern way.</p>

        <form id="signup-form">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Jordan Lee" required />

          <label for="role">Role</label>
          <select id="role">
            <option>Inventory Manager</option>
            <option>Warehouse Staff</option>
          </select>

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@company.com" required />

          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" />

          <button type="submit" class="btn btn--primary">Create Account</button>
        </form>
        <div id="form-message"></div>

        <div class="auth-card__footer">
          Already have an account? <a href="index.html">Log in</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
