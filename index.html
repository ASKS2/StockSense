<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StockSense — Log In</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-shell__side">
      <span>● StockSense</span>
      <h2>One ledger for every receipt, delivery, transfer and count.</h2>
      <p>Digitize your warehouse operations — no more registers, no more scattered spreadsheets.</p>
    </div>
    <div class="auth-shell__form">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p>Log in to your inventory dashboard.</p>

        <form id="login-form">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@company.com" required />

          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />

          <button type="submit" class="btn btn--primary">Log In</button>
        </form>
        <div id="form-message"></div>

        <div class="auth-card__footer">
          <a href="forgot-password.html">Forgot password?</a> &nbsp;·&nbsp;
          <a href="signup.html">Create an account</a>
        </div>
        <div class="auth-card__footer" style="margin-top:10px; color:var(--amber-dark);">
          Demo login: admin@stocksense.com / admin123
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
